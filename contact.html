    <section>
    <form id="contactform" novalidate>
        <h1>Neem contact op</h1>

        <label for="name">Naam:</label>
        <input type="text" id="name" name="name" aria-describedby="name-error" aria-invalid="false">
        <span class="error-message" id="name-error" role="alert"></span>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" aria-describedby="email-error" aria-invalid="false">
        <span class="error-message" id="email-error" role="alert"></span>
        <br><br>

        <label for="message">Bericht:</label><br>
        <textarea id="message" name="message" aria-describedby="message-error" aria-invalid="false"></textarea>
        <span class="error-message" id="message-error" role="alert"></span>
        <br><br>

        <input type="submit" value="Versturen">

        <div id="form-status" aria-live="polite"></div>
    </form>
</section>
<script src="script/contact.js"></script>
</body>
